<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Efektivita ownerů reklamací</title>
<style>
:root {
  color-scheme: light;
  --font-anthropic-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  --font-anthropic-serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --color-bg: #f7f6f2; --color-panel: #ffffff; --color-fg: #1f1e1b; --color-fg-muted: #6b6860;
  --color-border-line: #e3e0d8; --color-ok: #1a7f4b; --color-warn: #b7791f; --color-bad: #c0392b;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 16px; --cds-gap-lg: 24px; --cds-gap-xl: 32px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 20px;
  --cds-radius: 8px; --cds-font-weight-medium: 600;
  --cds-font-size-caption: 12px; --cds-font-size-body: 14px; --cds-font-size-heading: 16px; --cds-font-size-title: 28px;
  --cds-dur-slow: .6s; --cds-ease-out: cubic-bezier(.2,.8,.2,1);
  --cds-chart-grid: #ece9e2; --cds-chart-axis: #b9b5ab; --cds-chart-reference: #8a867c; --cds-chart-muted: #b8b5ad;
  --cds-surface-popover: #ffffff; --cds-border: #e3e0d8; --cds-shadow-popover: 0 6px 20px rgba(0,0,0,.12); --cds-text-secondary: #6b6860;
  --s0: #2f6fdf; --s1: #e8730c; --s2: #12a37a; --s3: #7c5ce6; --s4: #d4a106; --s5: #d6457a; --s6: #4a90a4; --s7: #8a6d5b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --color-bg: #191917; --color-panel: #23221f; --color-fg: #ecebe6; --color-fg-muted: #a19e95;
    --color-border-line: #3a3833; --color-ok: #4cc38a; --color-warn: #e0b04a; --color-bad: #ef6b5c;
    --cds-chart-grid: #34322d; --cds-chart-axis: #5c5952; --cds-chart-reference: #8f8b82; --cds-chart-muted: #6d6a63;
    --cds-surface-popover: #2b2a26; --cds-border: #3a3833; --cds-shadow-popover: 0 6px 20px rgba(0,0,0,.5); --cds-text-secondary: #a19e95;
    --s0: #6b9cf2; --s1: #f59547; --s2: #3cc79c; --s3: #a28bf2; --s4: #e8c13f; --s5: #ee77a0; --s6: #74b4c7; --s7: #b4927c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); }
#dash-root { max-width: 1280px; margin: 0 auto; padding: 32px 16px 48px; }
.lx-stamp { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 4px 10px; background: var(--color-panel); }
.lx-foot { margin-top: 32px; font-size: 12px; color: var(--color-fg-muted); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
window.DASH_DATA = __DATA__;
window.dash = (() => {
  const raw = window.DASH_DATA, calcs = {}, draws = {}, cache = {};
  const data = (id) => {
    if (id in raw) return { status: 'ok', data: raw[id], columns: raw[id].length ? Object.keys(raw[id][0]) : [], meta: [] };
    if (calcs[id]) {
      if (!(id in cache)) cache[id] = calcs[id].fn(...calcs[id].inputs.map((i) => data(i).data));
      return { status: 'ok', data: cache[id], meta: [] };
    }
    return { status: 'missing', data: [] };
  };
  const run = (name) => document.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => draws[name](el));
  return {
    data,
    calc: (id, o) => { calcs[id] = o; },
    loader: () => {},
    draw: (name, fn) => { if (fn) draws[name] = fn; else run(name); },
    onData: (fn) => fn(),
    refresh: () => {},
    params: () => ({}), setParams: () => {}, resetParams: () => {}, setLink: () => {},
    colors: ['var(--s0)', 'var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)'],
    _runAll: () => Object.keys(draws).forEach(run),
  };
})();
</script>
</head>
<body>
<div id="dash-root">
__PAGE__
<p class="lx-foot">Statický snímek dat ze Salesforce ke __STAMP__. Externí reklamace (Complaint, typ External), owneři Pavel Tran Son, Marco Antonio Sinica a Kryštof Veber.</p>
</div>
<script>
document.querySelectorAll('.dash-skeleton').forEach((e) => e.classList.remove('dash-skeleton'));
dash._runAll();
let lxT; window.addEventListener('resize', () => { clearTimeout(lxT); lxT = setTimeout(dash._runAll, 150); });
</script>
</body>
</html>
